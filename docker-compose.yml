services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hazel
      POSTGRES_PASSWORD: hazel
      POSTGRES_DB: hazelglen
    volumes:
      - db_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazel -d hazelglen"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://hazel:hazel@db:5432/hazelglen?schema=public
      JWT_SECRET: change-me-in-production
      CORS_ORIGIN: http://localhost:3000
      UPLOAD_DIR: /app/uploads
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]
    volumes:
      - api_uploads:/app/uploads

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  db_data:
  api_uploads:
