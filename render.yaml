# Render Blueprint for Hazel Glen Care (preview / demo).
# In Render: New + → "Blueprint" → connect the repo → it reads this file.
# See DEPLOY-RENDER.md for the full walkthrough.

databases:
  - name: hazel-glen-db
    databaseName: hazelglen
    user: hazel
    plan: free

services:
  # ---- Backend API (Node/Express/Prisma) ----
  - type: web
    name: hazel-glen-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    # db push is idempotent; safe to run on every start. Seed once from the Shell.
    startCommand: npx prisma db push --skip-generate && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hazel-glen-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Must match the web service's public URL (adjust if Render assigns a suffix).
      - key: CORS_ORIGIN
        value: https://hazel-glen-web.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/uploads

  # ---- Frontend (Next.js) ----
  - type: web
    name: hazel-glen-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      # Baked in at build time — must point at the API's public URL + /api.
      - key: NEXT_PUBLIC_API_URL
        value: https://hazel-glen-api.onrender.com/api
